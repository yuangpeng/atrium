[project]
name = "atrium"
version = "0.1.0"
description = "A project-centric workbench for coding agents (Claude Code first; harness-agnostic by design)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.170",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "watchfiles>=0.24",
]

[project.scripts]
atrium = "atrium.cli:main"
atrium-web-mcp = "atrium.mcp.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atrium"]
